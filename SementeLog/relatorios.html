<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SementeLog Relatórios</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="icon" href="favicon.ico" type="image/x-icon">
<!-- ADICIONAR A BIBLIOTECA JSPDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="container">
    <aside class="sidebar">
        <div class="logo-container">
            <i class="fa-solid fa-seedling logo-icon"></i>
            <span class="logo-text">SementeLog</span>
        </div>
        <nav class="menu">
            <a href="compras.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> Compras</a>
            <a href="estoque.html" class="menu-item"><i class="fa-solid fa-box-open"></i> Estoque</a>
            <a href="logistica.html" class="menu-item"><i class="fa-solid fa-truck"></i> Logística</a>
            <a href="relatorios.html" class="menu-item active"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
            <a href="Qrcode.html" class="menu-item"><i class="fa-solid fa-qrcode"></i> QRcode Informações</a>
            <a href="auditoria.html" class="menu-item"><i class="fa-solid fa-money-check-dollar"></i> Auditoria</a>
            <a href="cadastro.html" class="menu-item"><i class="fa-solid fa-user-plus"></i> Cadastro</a>
        </nav>
    </aside>

    <main class="content-area">
        <!-- BARRA SUPERIOR SIMPLIFICADA -->
        <div class="top-bar">
            <div class="user-controls">
                <span class="user-info-text">
                    <i class="fa-solid fa-user"></i>
                    <span id="userDisplayName">Usuário</span>
                </span>
                <button class="logout-btn" onclick="logout()">
                    <i class="fa-solid fa-sign-out-alt"></i> Sair
                </button>
            </div>
        </div>

        <!-- CONTEÚDO ORIGINAL SEM ALTERAÇÕES -->
        <section class="relatorios-card">
            <header class="cadastro-header">
                <h1>Relatórios</h1>
            </header>

            <section class="relatorios-filters">
                <div class="filter-group period">
                    <label for="data-inicio">Data Início</label>
                    <input type="date" class="date-input" id="data-inicio">
                    <label for="data-fim">Data Fim</label>
                    <input type="date" class="date-input" id="data-fim">
                </div>

                <div class="filter-group type">
                    <label for="tipo-relatorio">Tipo</label>
                    <select class="dropdown" id="tipo-relatorio">
                        <option value="Mensal">Mensal</option>
                        <option value="Semanal">Semanal</option>
                    </select>
                </div>

                <div class="filter-group sector">
                    <label for="setor-relatorio">Setor</label>
                    <select class="dropdown" id="setor-relatorio">
                        <option value="Todos">Todos</option>
                        <option value="Fornecedor">Fornecedor</option>
                        <option value="Estoque">Estoque</option>
                        <option value="Cooperativa">Cooperativa</option>
                        <option value="Compras">Compras</option>
                        <option value="Saida">Saida</option>
                    </select>
                </div>

                <div class="action-buttons-group">
                    <button class="action-button generate" id="gerar-relatorio">Gerar Relatórios</button>
                    <button class="action-button export-pdf" id="exportar-pdf">Exportar PDF</button>
                </div>
            </section>

            <section class="charts-area">
                <div class="chart-container bar-chart">
                    <h2>Entregas de Sementes</h2>
                    <div class="chart-content">
                        <div class="y-axis">
                            <span>20.000</span>
                            <span>15.000</span>
                            <span>10.000</span>
                            <span>5.000</span>
                            <span></span>
                        </div>
                        <div class="bars" id="barras-sementes"></div>
                    </div>
                </div>

                <div class="chart-container pie-chart">
                    <h2>Espécies Distribuídas</h2>
                    <div class="pie-content">
                        <div class="pie-wrapper">
                            <div class="pie" id="pie-chart"></div>
                        </div>
                        <div class="legend">
                            <p><span class="legend-color milho"></span> Milho</p>
                            <p><span class="legend-color feijao"></span> Feijão</p>
                        </div>
                    </div>
                </div>
            </section>
        </section>
    </main>
</div>

<!-- Modal de Logout SIMPLES -->
<div id="logout-modal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h3><i class="fa-solid fa-door-open"></i> Confirmar Saída</h3>
        </div>
        <div class="modal-body">
            <p>Tem certeza que deseja sair do sistema?</p>
        </div>
        <div class="modal-footer">
            <button id="cancel-logout" class="secondary-btn">Cancelar</button>
            <button id="confirm-logout" class="login-btn">Sim, Sair</button>
        </div>
    </div>
</div>

<script>
// ========== FUNÇÕES DO USUÁRIO ==========
function mostrarNomeUsuario() {
    // Tenta pegar o nome do usuário
    const usuarioNome = localStorage.getItem('usuario_nome') || 
                       localStorage.getItem('nome') || 
                       localStorage.getItem('usuario') || 
                       'Usuário';
    
    // Mostra o nome no topo
    document.getElementById('userDisplayName').textContent = usuarioNome;
}

function logout() {
    document.getElementById('logout-modal').style.display = 'flex';
}

// ========== LÓGICA ORIGINAL DOS RELATÓRIOS ==========
const relatorioData = {
    Mensal: {Todos:[5000,7000,6000,8000,7500,6500,7200,8100,6700,6900,7100,7300],
              Fornecedor:[5000,7000,6000,8000,7500,6500,7200,8100,6700,6900,7100,7300],
              Estoque:[3000,4000,3500,5000,4500,3800,4200,4600,4100,4300,4400,4700],
              Compras:[2000,2500,2200,2800,2600,2400,2300,2700,2500,2600,2800,2900],
              Cooperativa:[1000,1200,1100,1300,1250,1150,1200,1250,1180,1230,1270,1300],
              Saida:[1500,1700,1600,1800,1750,1650,1720,1810,1670,1690,1710,1730]},
    Semanal:{Todos:[1200,1500,1300,1600,1400,1350,1450,1500,1380,1420,1470,1520],
             Fornecedor:[1200,1500,1300,1600,1400,1350,1450,1500,1380,1420,1470,1520],
             Estoque:[800,900,850,950,900,880,920,940,890,910,930,950],
             Compras:[400,500,450,480,470,460,450,490,470,480,500,510],
             Cooperativa:[200,250,230,260,240,235,245,250,238,242,247,252],
             Saida:[300,350,320,360,340,335,345,350,338,342,347,352]}
};
const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const semanas = ['Sem 1','Sem 2','Sem 3','Sem 4','Sem 5','Sem 6','Sem 7','Sem 8','Sem 9','Sem 10','Sem 11','Sem 12'];

function gerarRelatorio() {
    const tipo = document.getElementById('tipo-relatorio').value;
    const setor = document.getElementById('setor-relatorio').value;
    const barrasContainer = document.getElementById('barras-sementes');
    const pieChart = document.getElementById('pie-chart');

    barrasContainer.innerHTML = '';
    const valores = relatorioData[tipo][setor] || Array(12).fill(0);
    
    // Usa labels corretos conforme tipo
    const labels = tipo === 'Mensal' ? meses : semanas;
    
    valores.forEach((val,i)=>{
        const div = document.createElement('div');
        div.classList.add('bar');
        div.style.height = (val/20000*100)+'%';
        div.title = `${labels[i]}: ${val} Kg`;
        div.textContent = labels[i];
        barrasContainer.appendChild(div);
    });

    const total = valores.reduce((a,b)=>a+b,0);
    const milhoPercent = total? Math.round((valores[0]/total)*100):0;
    const feijaoPercent = total? Math.round((valores[1]/total)*100):0;
    pieChart.style.background = `conic-gradient(green 0% ${milhoPercent}%, orange ${milhoPercent}% ${milhoPercent+feijaoPercent}%, gray ${milhoPercent+feijaoPercent}% 100%)`;
}

// ========== FUNÇÃO PARA EXPORTAR PDF ==========
function exportarParaPDF() {
    try {
        // Verifica se a biblioteca jsPDF está carregada
        if (typeof window.jspdf === 'undefined') {
            alert('Biblioteca jsPDF não carregada. Verifique sua conexão com a internet.');
            return;
        }
        
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        
        // Configurações do PDF
        const tipo = document.getElementById('tipo-relatorio').value;
        const setor = document.getElementById('setor-relatorio').value;
        const dataInicio = document.getElementById('data-inicio').value || 'Não definida';
        const dataFim = document.getElementById('data-fim').value || 'Não definida';
        const valores = relatorioData[tipo][setor] || Array(12).fill(0);
        const labels = tipo === 'Mensal' ? meses : semanas;
        
        // Cabeçalho
        doc.setFontSize(20);
        doc.setTextColor(39, 174, 96); // Cor verde do SementeLog
        doc.text('Relatório SementeLog', 14, 20);
        
        // Informações do relatório
        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text(`Período: ${dataInicio} até ${dataFim}`, 14, 30);
        doc.text(`Tipo: ${tipo}`, 14, 37);
        doc.text(`Setor: ${setor}`, 14, 44);
        
        // Dados da tabela
        doc.setFontSize(14);
        doc.text('Dados Detalhados', 14, 55);
        
        // Cabeçalho da tabela
        doc.setFontSize(10);
        let y = 65;
        doc.text('Período', 14, y);
        doc.text('Quantidade (Kg)', 70, y);
        doc.text('Milho (Kg)', 120, y);
        doc.text('Feijão (Kg)', 170, y);
        
        y += 8;
        
        // Linhas da tabela
        let totalGeral = 0;
        let totalMilho = 0;
        let totalFeijao = 0;
        
        valores.forEach((valor, index) => {
            if (y > 270) {
                doc.addPage();
                y = 20;
            }
            
            const milho = Math.round(valor * 0.45);
            const feijao = Math.round(valor * 0.35);
            
            doc.text(labels[index], 14, y);
            doc.text(valor.toString(), 70, y);
            doc.text(milho.toString(), 120, y);
            doc.text(feijao.toString(), 170, y);
            
            totalGeral += valor;
            totalMilho += milho;
            totalFeijao += feijao;
            
            y += 7;
        });
        
        // Linha de total
        y += 5;
        doc.setFontSize(11);
        doc.setFont(undefined, 'bold');
        doc.text('TOTAL', 14, y);
        doc.text(totalGeral.toString(), 70, y);
        doc.text(totalMilho.toString(), 120, y);
        doc.text(totalFeijao.toString(), 170, y);
        
        // Resumo
        y += 15;
        doc.setFontSize(12);
        doc.text('Resumo', 14, y);
        doc.setFontSize(10);
        doc.setFont(undefined, 'normal');
        y += 7;
        doc.text(`Total Geral: ${totalGeral.toLocaleString('pt-BR')} Kg`, 14, y);
        y += 6;
        doc.text(`Milho: ${totalMilho.toLocaleString('pt-BR')} Kg (${Math.round((totalMilho/totalGeral)*100)}%)`, 14, y);
        y += 6;
        doc.text(`Feijão: ${totalFeijao.toLocaleString('pt-BR')} Kg (${Math.round((totalFeijao/totalGeral)*100)}%)`, 14, y);
        
        // Rodapé
        const dataAtual = new Date().toLocaleDateString('pt-BR');
        const horaAtual = new Date().toLocaleTimeString('pt-BR');
        doc.setFontSize(8);
        doc.text(`Gerado em: ${dataAtual} às ${horaAtual}`, 14, 287);
        doc.text('Sistema SementeLog - Gestão de Insumos Agrícolas', 14, 292);
        
        // Salva o PDF
        const nomeArquivo = `relatorio_sementelog_${setor}_${tipo.toLowerCase()}_${dataAtual.replace(/\//g, '-')}.pdf`;
        doc.save(nomeArquivo);
        
    } catch (error) {
        console.error('Erro ao gerar PDF:', error);
        alert('Erro ao gerar PDF. Verifique o console para detalhes.');
    }
}

// ========== INICIALIZAÇÃO ==========
document.addEventListener('DOMContentLoaded', function() {
    // Mostra nome do usuário
    mostrarNomeUsuario();
    
    // Configura eventos dos relatórios
    document.getElementById('gerar-relatorio').addEventListener('click', gerarRelatorio);
    
    // Configura evento para exportar PDF
    document.getElementById('exportar-pdf').addEventListener('click', exportarParaPDF);
    
    // Configura datas iniciais
    const hoje = new Date();
    const primeiroDiaMes = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    document.getElementById('data-inicio').value = primeiroDiaMes.toISOString().split('T')[0];
    document.getElementById('data-fim').value = hoje.toISOString().split('T')[0];
    
    // Gera relatório inicial
    gerarRelatorio();
    
    // Modal de logout
    const logoutModal = document.getElementById('logout-modal');
    const confirmLogout = document.getElementById('confirm-logout');
    const cancelLogout = document.getElementById('cancel-logout');

    confirmLogout.addEventListener("click", () => {
        // Limpa todos os dados
        localStorage.removeItem('usuario_logado');
        localStorage.removeItem('usuario_id');
        localStorage.removeItem('usuario_nome');
        localStorage.removeItem('usuario_email');
        localStorage.removeItem('usuario_username');
        localStorage.removeItem('token');
        localStorage.removeItem('nome');
        localStorage.removeItem('usuario');
        
        // Redireciona para login
        window.location.href = "login.html";
    });

    cancelLogout.addEventListener("click", () => {
        logoutModal.style.display = 'none';
    });

    // Fecha modal ao clicar fora
    window.addEventListener('click', (e) => {
        if (e.target === logoutModal) {
            logoutModal.style.display = 'none';
        }
    });
});
</script>
</body>
</html>
