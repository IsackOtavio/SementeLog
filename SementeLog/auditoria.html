<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SementeLog - Auditoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fa-solid fa-seedling logo-icon"></i>
                <span class="logo-text">SementeLog</span>
            </div>
            
            <nav class="menu">
                <a href="compras.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> Compras</a>
                <a href="estoque.html" class="menu-item"><i class="fa-solid fa-box-open"></i> Estoque</a>
                <a href="logistica.html" class="menu-item"><i class="fa-solid fa-truck"></i> Logística</a>
                <a href="relatorios.html" class="menu-item"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
                <a href="qrcode.html" class="menu-item"><i class="fa-solid fa-qrcode"></i> QR Code</a>
                <a href="auditoria.html" class="menu-item active"><i class="fa-solid fa-money-check-dollar"></i> Auditoria</a>
                <a href="cadastro.html" class="menu-item"><i class="fa-solid fa-user-plus"></i> Cadastro</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="content-area">
            <!-- Barra Superior com Nome do Usuário -->
            <div class="top-bar">
              
                <div class="user-controls">
                    <span class="user-info-text">
                        <i class="fa-solid fa-user"></i>
                        <span id="userDisplayName">Usuário</span>
                    </span>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fa-solid fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>

            <!-- Card de Auditoria -->
            <div class="auditoria-card">
                <div class="cadastro-header">
                    <h1><i class="fa-solid fa-file-contract"></i> Documentos de Auditoria</h1>
                    <p class="page-subtitle">Gerencie e visualize os documentos do sistema</p>
                </div>

                <div class="auditoria-content">
                    <!-- Documentos -->
                    <div class="documents-block">
                        <div class="doc-wrapper">
                            <button class="doc-button" data-doc="manual_operacoes">
                                <i class="fa-solid fa-book"></i> MANUAL DE OPERAÇÕES
                            </button>
                            <textarea placeholder="Digite suas observações aqui..." 
                                      class="doc-observacao" 
                                      data-doc="manual_operacoes"></textarea>
                        </div>
                        
                        <div class="doc-wrapper">
                            <button class="doc-button" data-doc="habilitacao_fornecedores">
                                <i class="fa-solid fa-truck-loading"></i> HABILITAÇÃO DE FORNECEDORES
                            </button>
                            <textarea placeholder="Digite suas observações aqui..." 
                                      class="doc-observacao" 
                                      data-doc="habilitacao_fornecedores"></textarea>
                        </div>
                        
                        <div class="doc-wrapper">
                            <button class="doc-button" data-doc="edital_licitacoes">
                                <i class="fa-solid fa-gavel"></i> EDITAL LICITAÇÕES
                            </button>
                            <textarea placeholder="Digite suas observações aqui..." 
                                      class="doc-observacao" 
                                      data-doc="edital_licitacoes"></textarea>
                        </div>
                        
                        <div class="doc-wrapper">
                            <button class="doc-button" data-doc="inventario">
                                <i class="fa-solid fa-boxes-stacked"></i> INVENTÁRIO
                            </button>
                            <textarea placeholder="Digite suas observações aqui..." 
                                      class="doc-observacao" 
                                      data-doc="inventario"></textarea>
                        </div>
                    </div>

                    <!-- Visualizador PDF -->
                    <div class="pdf-viewer-container">
                        <h3><i class="fa-solid fa-file-pdf"></i> Visualização do Documento</h3>
                        <iframe id="pdf-viewer" width="100%" height="500px" 
                                style="border: 1px solid #ddd; border-radius: 8px; margin-top: 10px;">
                        </iframe>
                    </div>
                    
                    <!-- Informações do Usuário Logado -->
                    <div class="user-audit-info">
                        <p><i class="fa-solid fa-user-check"></i> 
                           <strong>Usuário responsável:</strong> 
                           <span id="auditUserName"></span>
                        </p>
                        <p><i class="fa-solid fa-calendar"></i> 
                           <strong>Data/hora:</strong> 
                           <span id="currentDateTime"></span>
                        </p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal de Logout -->
    <div id="logout-modal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-door-open"></i> Confirmar Saída</h3>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja sair do sistema?</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-logout" class="secondary-btn">Cancelar</button>
                <button id="confirm-logout" class="login-btn">Sim, Sair</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const { jsPDF } = window.jspdf;

        // ========== CONTEÚDO DOS DOCUMENTOS ==========
        const documentos = {
            manual_operacoes: {
                titulo: "Manual de Operações - SementeLog",
                texto: `DOCUMENTO OFICIAL
                
Este manual detalha todas as operações internas da SementeLog, incluindo:
1. Procedimentos de compras e aquisições
2. Controle de estoque e inventário
3. Processos logísticos
4. Normas de auditoria interna
5. Fluxos de processos e responsabilidades
6. Controles de qualidade e segurança

DATA DE EMISSÃO: ${new Date().toLocaleDateString('pt-BR')}
VERSÃO: 1.0
`
            },
            habilitacao_fornecedores: {
                titulo: "Habilitação de Fornecedores - SementeLog",
                texto: `CRITÉRIOS DE HABILITAÇÃO
                
1. Documentação necessária:
   - CNPJ válido e ativo
   - Certidões negativas
   - Registros profissionais

2. Análise de Qualificação:
   - Experiência no mercado
   - Referências comerciais
   - Capacidade técnica

3. Avaliação de Riscos:
   - Situação financeira
   - Conformidade legal
   - Histórico de desempenho

DATA DE EMISSÃO: ${new Date().toLocaleDateString('pt-BR')}
`
            },
            edital_licitacoes: {
                titulo: "Edital de Licitações - SementeLog",
                texto: `EDITAL Nº 001/2024
                
PROCESSO LICITATÓRIO PARA AQUISIÇÃO DE INSUMOS AGRÍCOLAS

1. OBJETO: Aquisição de sementes, fertilizantes e defensivos agrícolas.

2. CRITÉRIOS DE JULGAMENTO:
   - Menor preço
   - Melhor técnica
   - Combinação de preço e técnica

3. DOCUMENTAÇÃO EXIGIDA:
   - Proposta comercial
   - Comprovante de habilitação
   - Amostras técnicas

4. PRAZOS:
   - Abertura: ${new Date().toLocaleDateString('pt-BR')}
   - Encerramento: ${new Date(Date.now() + 30*24*60*60*1000).toLocaleDateString('pt-BR')}
`
            },
            inventario: {
                titulo: "Inventário - SementeLog",
                texto: `RELATÓRIO DE INVENTÁRIO
                
DATA DA CONTAGEM: ${new Date().toLocaleDateString('pt-BR')}

SEÇÃO A - SEMENTES:
- Soja: 1.500 sacos
- Milho: 800 sacos
- Trigo: 600 sacos
- Arroz: 400 sacos

SEÇÃO B - FERTILIZANTES:
- NPK 10-10-10: 200 ton
- Ureia: 150 ton
- Superfosfato: 100 ton

SEÇÃO C - DEFENSIVOS:
- Herbicidas: 500 litros
- Inseticidas: 300 litros
- Fungicidas: 400 litros

TOTAL GERAL: R$ 1.250.000,00
`
            }
        };

        // ========== FUNÇÕES DO SISTEMA ==========
        function mostrarNomeUsuario() {
            const nomeUsuario = localStorage.getItem('usuario_nome');
            const username = localStorage.getItem('usuario_username');
            
            // Verifica se o usuário está logado
            if (!localStorage.getItem('usuario_logado')) {
                window.location.href = "login.html";
                return;
            }
            
            // Mostra o nome no topo
            const userDisplayName = document.getElementById('userDisplayName');
            const auditUserName = document.getElementById('auditUserName');
            
            if (nomeUsuario && nomeUsuario !== 'undefined') {
                userDisplayName.textContent = nomeUsuario;
                auditUserName.textContent = nomeUsuario;
            } else if (username) {
                userDisplayName.textContent = username;
                auditUserName.textContent = username;
            } else {
                userDisplayName.textContent = 'Usuário';
                auditUserName.textContent = 'Usuário';
            }
            
            // Atualiza data/hora
            atualizarDataHora();
        }

        function atualizarDataHora() {
            const agora = new Date();
            const dataHora = agora.toLocaleDateString('pt-BR', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
            document.getElementById('currentDateTime').textContent = dataHora;
        }

        function logout() {
            const logoutModal = document.getElementById('logout-modal');
            logoutModal.style.display = 'flex';
        }

        // ========== FUNÇÕES DE PDF ==========
        function gerarPDF(docKey) {
            const docData = documentos[docKey];
            if (!docData) return;

            const observacao = document.querySelector(`textarea.doc-observacao[data-doc="${docKey}"]`).value;
            const nomeUsuario = localStorage.getItem('usuario_nome') || localStorage.getItem('usuario_username') || 'Usuário';

            const pdf = new jsPDF();
            
            // Cabeçalho
            pdf.setFontSize(20);
            pdf.setTextColor(40, 102, 60); // Verde escuro
            pdf.text(docData.titulo, 10, 20);
            
            // Linha divisória
            pdf.setDrawColor(40, 102, 60);
            pdf.line(10, 25, 200, 25);
            
            // Informações do sistema
            pdf.setFontSize(10);
            pdf.setTextColor(100, 100, 100);
            pdf.text(`Gerado por: ${nomeUsuario}`, 10, 35);
            pdf.text(`Data: ${new Date().toLocaleDateString('pt-BR')}`, 10, 42);
            
            // Conteúdo do documento
            pdf.setFontSize(12);
            pdf.setTextColor(0, 0, 0);
            const linhas = pdf.splitTextToSize(docData.texto, 180);
            pdf.text(linhas, 10, 55);
            
            // Observações do usuário
            if (observacao.trim() !== "") {
                pdf.setFontSize(14);
                pdf.setTextColor(40, 102, 60);
                pdf.text("OBSERVAÇÕES:", 10, 55 + linhas.length * 7 + 20);
                
                pdf.setFontSize(11);
                pdf.setTextColor(0, 0, 0);
                const obsLinhas = pdf.splitTextToSize(observacao, 180);
                pdf.text(obsLinhas, 10, 55 + linhas.length * 7 + 30);
            }
            
            // Rodapé
            pdf.setFontSize(8);
            pdf.setTextColor(150, 150, 150);
            pdf.text("Sistema SementeLog - Documento gerado automaticamente", 10, 280);
            pdf.text(`Página 1 de 1`, 180, 280);

            document.getElementById("pdf-viewer").src = pdf.output("bloburl");
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Mostra nome do usuário
            mostrarNomeUsuario();
            
            // Carregar observações salvas
            document.querySelectorAll(".doc-observacao").forEach(textarea => {
                const docKey = textarea.getAttribute("data-doc");
                const saved = localStorage.getItem(`obs_${docKey}`);
                if (saved) textarea.value = saved;

                textarea.addEventListener("input", () => {
                    localStorage.setItem(`obs_${docKey}`, textarea.value);
                });
            });

            // Evento de clique nos botões
            document.querySelectorAll(".doc-button").forEach(btn => {
                btn.addEventListener("click", () => {
                    const docKey = btn.getAttribute("data-doc");
                    gerarPDF(docKey);
                });
            });

            // Modal de logout
            const logoutModal = document.getElementById('logout-modal');
            const confirmLogout = document.getElementById('confirm-logout');
            const cancelLogout = document.getElementById('cancel-logout');

            confirmLogout.addEventListener("click", () => {
                // Limpa todos os dados
                localStorage.removeItem('usuario_logado');
                localStorage.removeItem('usuario_id');
                localStorage.removeItem('usuario_nome');
                localStorage.removeItem('usuario_email');
                localStorage.removeItem('usuario_username');
                localStorage.removeItem('token');
                
                // Redireciona
                window.location.href = "login.html";
            });

            cancelLogout.addEventListener("click", () => {
                logoutModal.style.display = 'none';
            });

            // Fecha modal ao clicar fora
            window.addEventListener('click', (e) => {
                if (e.target === logoutModal) {
                    logoutModal.style.display = 'none';
                }
            });

            // Gera o primeiro documento por padrão
            setTimeout(() => {
                gerarPDF('manual_operacoes');
            }, 500);
        });

        // Atualiza data/hora a cada minuto
        setInterval(atualizarDataHora, 60000);
    </script>
</body>
</html>
