<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema SementeLog - Pedido de Compra</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fa-solid fa-seedling logo-icon"></i>
                <span class="logo-text">SementeLog</span>
            </div>
            <nav class="menu">
                <a href="compras.html" class="menu-item"><i class="fa-solid fa-cart-shopping"></i> Compras</a>
                <a href="estoque.html" class="menu-item"><i class="fa-solid fa-box-open"></i> Estoque</a>
                <a href="logistica.html" class="menu-item"><i class="fa-solid fa-truck"></i> Logística</a>
                <a href="relatorios.html" class="menu-item"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
                <a href="qrcode.html" class="menu-item"><i class="fa-solid fa-qrcode"></i> QR Code</a>
                <a href="auditoria.html" class="menu-item"><i class="fa-solid fa-money-check-dollar"></i> Auditoria</a>
                <a href="cadastro.html" class="menu-item"><i class="fa-solid fa-user-plus"></i> Cadastro</a>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="content-area">
            <div class="top-bar">
                <div class="user-controls">
                    <span class="user-info-text">
                        <i class="fa-solid fa-user"></i>
                        <span id="userDisplayName">Usuário</span>
                    </span>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fa-solid fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>

            <!-- CARD PEDIDO -->
            <div class="pedido-card">
                <div class="cadastro-header">
                    <h1><i class="fa-solid fa-truck-loading"></i> Entrada de Mercadoria</h1>
                </div>

                <!-- TABS CORRIGIDAS - Sempre visíveis -->
                <div class="pedido-tabs">
                    <button class="tab-button active" onclick="showForm('fornecedor')" id="tab-fornecedor">
                        <i class="fa-solid fa-truck"></i> FORNECEDOR
                    </button>
                    <button class="tab-button" onclick="showForm('produto')" id="tab-produto">
                        <i class="fa-solid fa-box"></i> PRODUTO
                    </button>
                </div>

                <!-- ÁREA DOS FORMULÁRIOS -->
                <div id="forms-area">
                    <!-- FORMULÁRIO FORNECEDOR -->
                    <form id="fornecedor-form" class="pedido-form">
                        <div class="form-section-title">
                            <i class="fa-solid fa-building"></i> Dados do Fornecedor
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-id-card"></i> CNPJ</label>
                                <input type="text" name="cnpj" id="cnpj" placeholder="00.000.000/0001-00" required>
                            </div>
                            <div class="input-group flex-3">
                                <label><i class="fa-solid fa-file-signature"></i> RAZÃO SOCIAL</label>
                                <input type="text" name="razao_social" id="razao_social" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-5">
                                <label><i class="fa-solid fa-road"></i> ENDEREÇO</label>
                                <input type="text" name="endereco" id="endereco" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-1">
                                <label><i class="fa-solid fa-hashtag"></i> NÚMERO</label>
                                <input type="text" name="numero" id="numero" required>
                            </div>
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-map-marker-alt"></i> BAIRRO</label>
                                <input type="text" name="bairro" id="bairro" required>
                            </div>
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-city"></i> CIDADE</label>
                                <input type="text" name="cidade" id="cidade" required>
                            </div>
                            <div class="input-group flex-1">
                                <label><i class="fa-solid fa-flag"></i> ESTADO</label>
                                <input type="text" name="estado" id="estado" maxlength="2" required>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-1">
                                <label><i class="fa-solid fa-envelope"></i> CEP</label>
                                <input type="text" name="cep" id="cep" required>
                            </div>
                            <div class="input-group flex-1">
                                <label><i class="fa-solid fa-phone"></i> TELEFONE</label>
                                <input type="text" name="telefone" id="telefone" required>
                            </div>
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-user-tie"></i> CONTATO</label>
                                <input type="text" name="contato" id="contato" required>
                            </div>
                            <div class="input-group flex-3">
                                <label><i class="fa-solid fa-at"></i> E-MAIL</label>
                                <input type="email" name="email" id="email" required>
                            </div>
                        </div>

                        <div class="form-buttons">
                            <button type="button" class="action-button save" onclick="salvarFornecedor()">
                                <i class="fa-solid fa-save"></i> SALVAR
                            </button>
                            <button type="button" class="action-button" onclick="buscarFornecedor()">
                                <i class="fa-solid fa-search"></i> BUSCAR
                            </button>
                            <button type="button" class="action-button" onclick="limparFornecedor()">
                                <i class="fa-solid fa-eraser"></i> LIMPAR
                            </button>
                        </div>
                    </form>

                    <!-- FORMULÁRIO PRODUTO -->
                    <form id="produto-form" class="pedido-form" style="display:none;">
                        <div class="form-section-title">
                            <i class="fa-solid fa-box-open"></i> Dados do Produto
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-1">
                                <label><i class="fa-solid fa-barcode"></i> CÓDIGO</label>
                                <input type="text" id="produto-codigo" required placeholder="Ex: PROD001">
                            </div>
                            <div class="input-group flex-4">
                                <label><i class="fa-solid fa-file-alt"></i> DESCRIÇÃO</label>
                                <input type="text" id="produto-descricao" required placeholder="Nome do produto">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-boxes"></i> QUANTIDADE</label>
                                <input type="number" id="produto-quantidade" required min="1" oninput="calcularValorTotal()">
                            </div>
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-money-bill-wave"></i> VALOR UNITÁRIO (R$)</label>
                                <input type="number" id="produto-valor-unitario" required min="0" step="0.01" oninput="calcularValorTotal()">
                            </div>
                            <div class="input-group flex-2">
                                <label><i class="fa-solid fa-calculator"></i> VALOR TOTAL (R$)</label>
                                <input type="text" id="produto-valor-total" readonly>
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-3">
                                <label><i class="fa-solid fa-calendar"></i> DATA DA ENTRADA</label>
                                <input type="date" id="produto-data" required>
                            </div>
                            <div class="input-group flex-3">
                                <label><i class="fa-solid fa-truck"></i> FORNECEDOR (opcional)</label>
                                <input type="text" id="produto-fornecedor" placeholder="Nome do fornecedor">
                            </div>
                        </div>

                        <div class="input-row">
                            <div class="input-group flex-6">
                                <label><i class="fa-solid fa-sticky-note"></i> OBSERVAÇÕES</label>
                                <textarea id="produto-observacoes" rows="2" placeholder="Observações adicionais..."></textarea>
                            </div>
                        </div>

                        <div class="form-buttons">
                            <button type="button" class="action-button save" onclick="salvarProduto()">
                                <i class="fa-solid fa-save"></i> SALVAR PRODUTO
                            </button>
                            <button type="button" class="action-button cancel" onclick="limparProduto()">
                                <i class="fa-solid fa-eraser"></i> LIMPAR
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </main>
    </div>

<script>
// ========= FUNÇÕES DE NAVEGAÇÃO =========
function showForm(formType) {
    // Esconde todos os formulários
    document.getElementById('fornecedor-form').style.display = 'none';
    document.getElementById('produto-form').style.display = 'none';
    
    // Remove a classe 'active' de todas as tabs
    document.getElementById('tab-fornecedor').classList.remove('active');
    document.getElementById('tab-produto').classList.remove('active');
    
    // Mostra o formulário selecionado
    if (formType === 'fornecedor') {
        document.getElementById('fornecedor-form').style.display = 'block';
        document.getElementById('tab-fornecedor').classList.add('active');
    } else if (formType === 'produto') {
        document.getElementById('produto-form').style.display = 'block';
        document.getElementById('tab-produto').classList.add('active');
        
        // Preenche data atual
        const hoje = new Date().toISOString().split('T')[0];
        document.getElementById('produto-data').value = hoje;
    }
}

// ========= FUNÇÕES DO FORNECEDOR =========
function salvarFornecedor() {
    alert('Fornecedor salvo! (esta é uma demonstração)');
    // Implemente aqui a lógica real de salvar
}

function buscarFornecedor() {
    alert('Buscando fornecedor... (esta é uma demonstração)');
}

function limparFornecedor() {
    document.getElementById('fornecedor-form').reset();
}

// ========= FUNÇÕES DO PRODUTO =========
function calcularValorTotal() {
    const quantidade = parseFloat(document.getElementById('produto-quantidade').value) || 0;
    const valorUnitario = parseFloat(document.getElementById('produto-valor-unitario').value) || 0;
    const valorTotal = quantidade * valorUnitario;
    
    document.getElementById('produto-valor-total').value = 
        valorTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
}

function limparProduto() {
    document.getElementById('produto-form').reset();
    document.getElementById('produto-valor-total').value = '';
}

async function salvarProduto() {
    // Pega os valores do formulário
    const codigo = document.getElementById('produto-codigo').value.trim();
    const descricao = document.getElementById('produto-descricao').value.trim();
    const quantidade = parseInt(document.getElementById('produto-quantidade').value) || 0;
    const valorUnitario = parseFloat(document.getElementById('produto-valor-unitario').value) || 0;
    const dataEntrada = document.getElementById('produto-data').value;
    const fornecedor = document.getElementById('produto-fornecedor').value.trim();
    
    // Validações
    if (!codigo) {
        alert('Por favor, insira o código do produto!');
        return;
    }
    
    if (!descricao) {
        alert('Por favor, insira a descrição do produto!');
        return;
    }
    
    if (quantidade <= 0) {
        alert('A quantidade deve ser maior que zero!');
        return;
    }
    
    if (valorUnitario <= 0) {
        alert('O valor unitário deve ser maior que zero!');
        return;
    }
    
    if (!dataEntrada) {
        alert('Por favor, selecione a data da entrada!');
        return;
    }
    
    // Prepara os dados para enviar ao backend
    const produtoData = {
        codigo: codigo,
        produto: descricao,
        quantidade: quantidade,
        preco: valorUnitario,
        data_entrada: dataEntrada,
        fornecedor: fornecedor || null
    };
    
    try {
        // Mostra carregamento
        const btnSalvar = document.querySelector('#produto-form .save');
        const textoOriginal = btnSalvar.innerHTML;
        btnSalvar.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> SALVANDO...';
        btnSalvar.disabled = true;
        
        // Envia para o backend
        const response = await fetch('http://127.0.0.1:5000/entrada', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(produtoData)
        });
        
        const result = await response.json();
        
        // Restaura o botão
        btnSalvar.innerHTML = textoOriginal;
        btnSalvar.disabled = false;
        
        if (response.ok) {
            // Sucesso!
            alert(`✅ ${result.message}\n\nProduto: ${descricao}\nCódigo: ${codigo}\nQuantidade: ${quantidade}`);
            
            // Limpa o formulário
            limparProduto();
            
            // Pergunta se quer ver o estoque
            const verEstoque = confirm('Produto salvo com sucesso!\n\nDeseja ver o estoque atualizado?');
            if (verEstoque) {
                window.location.href = 'estoque.html';
            }
            
        } else {
            // Erro
            alert(`❌ Erro: ${result.error || 'Não foi possível salvar o produto'}`);
        }
        
    } catch (error) {
        console.error('Erro:', error);
        alert('❌ Erro de conexão com o servidor. Verifique se o backend está rodando.');
        
        // Restaura o botão em caso de erro
        const btnSalvar = document.querySelector('#produto-form .save');
        btnSalvar.innerHTML = '<i class="fa-solid fa-save"></i> SALVAR PRODUTO';
        btnSalvar.disabled = false;
    }
}

// ========= LOGOUT =========
function logout() {
    if (confirm('Deseja realmente sair do sistema?')) {
        window.location.href = 'login.html';
    }
}

// ========= INICIALIZAÇÃO =========
document.addEventListener('DOMContentLoaded', function() {
    // Mostra o formulário de fornecedor por padrão
    showForm('fornecedor');
    
    // Configura data mínima para hoje
    const hoje = new Date().toISOString().split('T')[0];
    const inputData = document.getElementById('produto-data');
    if (inputData) {
        inputData.min = hoje;
    }
    
    // Mostra nome do usuário
    const nomeUsuario = localStorage.getItem('nome') || localStorage.getItem('usuario') || 'Usuário';
    document.getElementById('userDisplayName').textContent = nomeUsuario;
});
</script>

</body>
</html>
