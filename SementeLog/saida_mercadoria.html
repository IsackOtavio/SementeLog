<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SementeLog - Saída de Mercadoria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fa-solid fa-seedling logo-icon"></i>
                <span class="logo-text">SementeLog</span>
            </div>
            <nav class="menu">
                <a href="compras.html" class="menu-item active"><i class="fa-solid fa-cart-shopping"></i> Compras</a>
                <a href="estoque.html" class="menu-item"><i class="fa-solid fa-box-open"></i> Estoque</a>
                <a href="logistica.html" class="menu-item"><i class="fa-solid fa-truck"></i> Logística</a>
                <a href="relatorios.html" class="menu-item"><i class="fa-solid fa-file-lines"></i> Relatórios</a>
                <a href="qrcode.html" class="menu-item"><i class="fa-solid fa-qrcode"></i> QRcode Informações</a>
                <a href="auditoria.html" class="menu-item"><i class="fa-solid fa-money-check-dollar"></i> Auditoria</a>
                <a href="cadastro.html" class="menu-item"><i class="fa-solid fa-user-plus"></i> Cadastro</a>
            </nav>
        </aside>

        <!-- ÁREA PRINCIPAL -->
        <main class="content-area">
            <!-- BARRA SUPERIOR COM NOME DO USUÁRIO E BOTÃO SAIR -->
            <div class="top-bar">
               
                <div class="user-controls">
                    <span class="user-info-text">
                        <i class="fa-solid fa-user"></i>
                        <span id="userDisplayName">Usuário</span>
                    </span>
                    <button class="logout-btn" onclick="logout()">
                        <i class="fa-solid fa-sign-out-alt"></i> Sair
                    </button>
                </div>
            </div>

            <!-- CARD PEDIDO -->
            <div class="pedido-card">
                <div class="cadastro-header">
                    <h1><i class="fa-solid fa-truck-loading"></i> Saída de Mercadoria</h1>
                </div>

                <!-- TABS -->
                <div class="pedido-tabs">
                    <button class="tab-button active" onclick="showForm('fornecedor')">
                        <i class="fa-solid fa-handshake"></i> COOPERATIVA
                    </button>
                    <button class="tab-button" onclick="showForm('produto')">
                        <i class="fa-solid fa-box"></i> PRODUTO
                    </button>
                </div>

                <!-- FORMULÁRIO COOPERATIVA -->
                <form id="fornecedor-form" class="pedido-form">
                    <div class="form-section-title">
                        <i class="fa-solid fa-building"></i> Dados da Cooperativa
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-id-card"></i> CNPJ</label>
                            <input type="text" name="cnpj" placeholder="00.000.000/0001-00" required
                                   oninput="formatarCNPJ(this)">
                        </div>
                        <div class="input-group flex-3">
                            <label><i class="fa-solid fa-file-signature"></i> RAZÃO SOCIAL</label>
                            <input type="text" name="razao_social" placeholder="Nome completo da cooperativa" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group flex-5">
                            <label><i class="fa-solid fa-road"></i> ENDEREÇO (RUA)</label>
                            <input type="text" name="endereco" placeholder="Rua, Avenida, etc." required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group flex-1">
                            <label><i class="fa-solid fa-hashtag"></i> NÚMERO</label>
                            <input type="text" name="numero" placeholder="123" required>
                        </div>
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-map-marker-alt"></i> BAIRRO</label>
                            <input type="text" name="bairro" placeholder="Bairro" required>
                        </div>
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-city"></i> CIDADE</label>
                            <input type="text" name="cidade" placeholder="Cidade" required>
                        </div>
                        <div class="input-group flex-1">
                            <label><i class="fa-solid fa-flag"></i> ESTADO</label>
                            <input type="text" name="estado" placeholder="UF" maxlength="2" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group flex-1">
                            <label><i class="fa-solid fa-envelope"></i> CEP</label>
                            <input type="text" name="cep" placeholder="00000-000" required
                                   oninput="formatarCEP(this)">
                        </div>
                        <div class="input-group flex-1">
                            <label><i class="fa-solid fa-phone"></i> TELEFONE</label>
                            <input type="text" name="telefone" placeholder="(00) 0000-0000" required
                                   oninput="formatarTelefone(this)">
                        </div>
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-user-tie"></i> CONTATO</label>
                            <input type="text" name="contato" placeholder="Nome do contato" required>
                        </div>
                        <div class="input-group flex-3">
                            <label><i class="fa-solid fa-at"></i> E-MAIL</label>
                            <input type="email" name="email" placeholder="email@cooperativa.com" required>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="action-button save">
                            <i class="fa-solid fa-save"></i> SALVAR
                        </button>
                        <button type="button" class="action-button" onclick="buscarCooperativa()">
                            <i class="fa-solid fa-search"></i> BUSCAR COOPERATIVA
                        </button>
                        <button type="button" class="action-button" onclick="atualizarCooperativa()">
                            <i class="fa-solid fa-edit"></i> ATUALIZAR
                        </button>
                        <button type="button" class="action-button cancel" onclick="deletarCooperativa()">
                            <i class="fa-solid fa-trash"></i> EXCLUIR
                        </button>
                    </div>
                </form>

                <!-- FORMULÁRIO PRODUTO -->
                <form id="produto-form" class="pedido-form" style="display: none;">
                    <div class="form-section-title">
                        <i class="fa-solid fa-box-open"></i> Dados do Produto
                    </div>
                    
                    <div class="input-row">
                        <div class="input-group flex-1">
                            <label><i class="fa-solid fa-barcode"></i> CÓDIGO</label>
                            <input type="number" name="codigo" id="codigo" placeholder="Código do produto" required>
                        </div>
                        <div class="input-group flex-4">
                            <label><i class="fa-solid fa-file-alt"></i> DESCRIÇÃO</label>
                            <input type="text" name="descricao" id="descricao" placeholder="Descrição detalhada" required>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group flex-5">
                            <label><i class="fa-solid fa-boxes"></i> QUANTIDADE</label>
                            <input type="number" name="quantidade" id="quantidade" placeholder="Quantidade" required 
                                   oninput="calcularValorTotal()">
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-money-bill-wave"></i> VALOR UNITÁRIO</label>
                            <input type="text" name="valor_unitario" id="valor_unitario" placeholder="R$ 0,00" required
                                   oninput="calcularValorTotal()">
                        </div>
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-calculator"></i> VALOR TOTAL</label>
                            <input type="text" name="valor_total" id="valor_total" placeholder="R$ 0,00" readonly>
                        </div>
                        <div class="input-group flex-2">
                            <label><i class="fa-solid fa-tag"></i> LOTE</label>
                            <input type="text" name="lote" id="lote" placeholder="Número do lote" required>
                        </div>
                    </div>

                    <div class="form-buttons">
                        <button type="submit" class="action-button save">
                            <i class="fa-solid fa-save"></i> SALVAR
                        </button>
                        <button type="button" onclick="buscarProduto()" class="action-button">
                            <i class="fa-solid fa-search"></i> BUSCAR PRODUTO
                        </button>
                        <button type="button" onclick="atualizarProduto()" class="action-button">
                            <i class="fa-solid fa-edit"></i> ATUALIZAR
                        </button>
                        <button type="button" class="action-button cancel" onclick="deletarProduto()">
                            <i class="fa-solid fa-trash"></i> EXCLUIR
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <!-- Modal de Logout -->
    <div id="logout-modal" class="modal" style="display:none;">
        <div class="modal-content" style="max-width: 400px;">
            <div class="modal-header">
                <h3><i class="fa-solid fa-door-open"></i> Confirmar Saída</h3>
            </div>
            <div class="modal-body">
                <p>Tem certeza que deseja sair do sistema?</p>
            </div>
            <div class="modal-footer">
                <button id="cancel-logout" class="secondary-btn">Cancelar</button>
                <button id="confirm-logout" class="login-btn">Sim, Sair</button>
            </div>
        </div>
    </div>

    <script>
        // ========== FUNÇÕES DO USUÁRIO ==========
        function mostrarNomeUsuario() {
            // Tenta pegar o nome do usuário
            const usuarioNome = localStorage.getItem('usuario_nome') || 
                               localStorage.getItem('nome') || 
                               localStorage.getItem('usuario') || 
                               'Usuário';
            
            // Mostra o nome no topo
            document.getElementById('userDisplayName').textContent = usuarioNome;
        }

        function logout() {
            document.getElementById('logout-modal').style.display = 'flex';
        }

        // ========== FUNÇÕES DE FORMATAÇÃO ==========
        function formatarCNPJ(input) {
            let valor = input.value.replace(/\D/g, '');
            
            if (valor.length > 14) {
                valor = valor.substring(0, 14);
            }
            
            if (valor.length > 12) {
                valor = valor.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/, '$1.$2.$3/$4-$5');
            } else if (valor.length > 8) {
                valor = valor.replace(/^(\d{2})(\d{3})(\d{3})(\d{0,4})/, '$1.$2.$3/$4');
            } else if (valor.length > 5) {
                valor = valor.replace(/^(\d{2})(\d{3})(\d{0,3})/, '$1.$2.$3');
            } else if (valor.length > 2) {
                valor = valor.replace(/^(\d{2})(\d{0,3})/, '$1.$2');
            }
            
            input.value = valor;
        }

        function formatarCEP(input) {
            let valor = input.value.replace(/\D/g, '');
            
            if (valor.length > 8) {
                valor = valor.substring(0, 8);
            }
            
            if (valor.length > 5) {
                valor = valor.replace(/^(\d{5})(\d{0,3})/, '$1-$2');
            }
            
            input.value = valor;
        }

        function formatarTelefone(input) {
            let valor = input.value.replace(/\D/g, '');
            
            if (valor.length > 11) {
                valor = valor.substring(0, 11);
            }
            
            if (valor.length > 10) {
                valor = valor.replace(/^(\d{2})(\d{1})(\d{4})(\d{4})/, '($1) $2 $3-$4');
            } else if (valor.length > 6) {
                valor = valor.replace(/^(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
            } else if (valor.length > 2) {
                valor = valor.replace(/^(\d{2})(\d{0,5})/, '($1) $2');
            }
            
            input.value = valor;
        }

        function calcularValorTotal() {
            const quantidade = parseFloat(document.getElementById('quantidade').value) || 0;
            const valorUnitario = parseFloat(
                document.getElementById('valor_unitario').value.replace('R$ ', '').replace('.', '').replace(',', '.')
            ) || 0;
            
            const valorTotal = quantidade * valorUnitario;
            
            document.getElementById('valor_total').value = 
                valorTotal.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
        }

        // ========== FUNÇÕES DOS FORMULÁRIOS ==========
        function showForm(form) {
            // Alterna entre formulários
            document.getElementById('fornecedor-form').style.display = form === 'fornecedor' ? 'block' : 'none';
            document.getElementById('produto-form').style.display = form === 'produto' ? 'block' : 'none';
            
            // Alterna a classe active nos botões
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            if(form === 'fornecedor') {
                document.querySelector('.pedido-tabs button:nth-child(1)').classList.add('active');
            }
            if(form === 'produto') {
                document.querySelector('.pedido-tabs button:nth-child(2)').classList.add('active');
            }
        }

        // Funções para formulário de cooperativa
        function buscarCooperativa() {
            const cnpj = document.querySelector('input[name="cnpj"]').value;
            if(cnpj && cnpj.replace(/\D/g, '').length >= 14) {
                alert(`Buscando cooperativa com CNPJ: ${cnpj}`);
                // Simulação: preenche dados fictícios
                document.querySelector('input[name="razao_social"]').value = "COOPERATIVA EXEMPLO LTDA";
            } else {
                alert("Digite um CNPJ válido para buscar");
                document.querySelector('input[name="cnpj"]').focus();
            }
        }

        function atualizarCooperativa() {
            if(confirm("Deseja atualizar os dados da cooperativa?")) {
                alert("Cooperativa atualizada com sucesso!");
            }
        }

        function deletarCooperativa() {
            if(confirm("Tem certeza que deseja excluir esta cooperativa?")) {
                alert("Cooperativa excluída!");
                document.getElementById('fornecedor-form').reset();
            }
        }

        // Funções para formulário de produto
        function buscarProduto() {
            const codigo = document.getElementById('codigo').value;
            if(codigo) {
                alert(`Buscando produto com código: ${codigo}`);
                // Simulação: preenche dados fictícios
                document.getElementById('descricao').value = "PRODUTO EXEMPLO";
                document.getElementById('quantidade').value = "10";
                document.getElementById('valor_unitario').value = "R$ 150,00";
                document.getElementById('lote').value = "LOTE-2024-001";
                calcularValorTotal();
            } else {
                alert("Digite um código para buscar");
                document.getElementById('codigo').focus();
            }
        }

        function atualizarProduto() {
            if(confirm("Deseja atualizar os dados do produto?")) {
                alert("Produto atualizado com sucesso!");
            }
        }

        function deletarProduto() {
            if(confirm("Tem certeza que deseja excluir este produto?")) {
                alert("Produto excluído!");
                document.getElementById('produto-form').reset();
            }
        }

        // ========== INICIALIZAÇÃO ==========
        document.addEventListener('DOMContentLoaded', function() {
            // Mostra nome do usuário
            mostrarNomeUsuario();
            
            // Event Listeners para formulários
            document.getElementById('fornecedor-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert("Cooperativa salva com sucesso!");
            });
            
            document.getElementById('produto-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert("Produto salvo com sucesso!");
            });
            
            // Formatação de valores monetários
            const valorUnitario = document.getElementById('valor_unitario');
            if(valorUnitario) {
                valorUnitario.addEventListener('input', function(e) {
                    let value = e.target.value.replace(/\D/g, '');
                    value = (parseInt(value) / 100).toFixed(2);
                    e.target.value = value ? 'R$ ' + value.replace('.', ',') : '';
                    calcularValorTotal();
                });
            }
            
            // Modal de logout
            const logoutModal = document.getElementById('logout-modal');
            const confirmLogout = document.getElementById('confirm-logout');
            const cancelLogout = document.getElementById('cancel-logout');

            confirmLogout.addEventListener("click", () => {
                // Limpa todos os dados
                localStorage.removeItem('usuario_logado');
                localStorage.removeItem('usuario_id');
                localStorage.removeItem('usuario_nome');
                localStorage.removeItem('usuario_email');
                localStorage.removeItem('usuario_username');
                localStorage.removeItem('token');
                localStorage.removeItem('nome');
                localStorage.removeItem('usuario');
                
                // Redireciona para login
                window.location.href = "login.html";
            });

            cancelLogout.addEventListener("click", () => {
                logoutModal.style.display = 'none';
            });

            // Fecha modal ao clicar fora
            window.addEventListener('click', (e) => {
                if (e.target === logoutModal) {
                    logoutModal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
